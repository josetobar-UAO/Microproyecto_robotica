; ESP32-CAM AI Thinker (ESP-32S)
; Flash via FTDI: conectar IO0→GND durante upload, soltar despues
; Baud monitor: 115200
 
[env:esp32cam]
platform      = espressif32
board         = esp32cam
framework     = arduino
monitor_speed = 115200
upload_speed  = 115200
upload_port   = /dev/ttyUSB0
monitor_port  = /dev/ttyUSB0

build_flags =
  -DWIFI_SSID='"Familia Tobar"'
  -DWIFI_PASSWORD='"06403836"'
  -DSTREAM_PORT=81